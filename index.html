<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apuração Presidente 2026 · 2º turno</title>
<meta name="theme-color" content="#0f1115">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#111418;--tx2:#5b6270;--tx3:#8b93a1;--bd:#e5e8ed;--sub:#eef0f3;--lula:#c8102e;--flavio:#1d4fa3;--ok:#1f9d55}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#171a20;--tx:#f1f3f6;--tx2:#a9b0bc;--tx3:#737b88;--bd:#262a33;--sub:#22262e;--lula:#e23848;--flavio:#3d7be0}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:16px 14px 60px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin-bottom:10px}
h1{font-size:17px;font-weight:650;margin:0;letter-spacing:-.01em}
.meta{color:var(--tx2);font-size:13px;display:flex;flex-wrap:wrap;gap:4px 12px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px;vertical-align:1px}
.dot.live{animation:p 1.6s infinite}.dot.pause{background:#e0a100}.dot.err{background:#d33}
@keyframes p{0%{box-shadow:0 0 0 0 rgba(31,157,85,.5)}70%{box-shadow:0 0 0 8px rgba(31,157,85,0)}100%{box-shadow:0 0 0 0 rgba(31,157,85,0)}}
.prog{height:4px;background:var(--sub);border-radius:2px;overflow:hidden;margin:4px 0 14px}.prog>i{display:block;height:100%;background:var(--tx);width:0;transition:width .6s}
.banner{display:none;background:rgba(224,161,0,.12);color:var(--tx);border:1px solid rgba(224,161,0,.35);padding:8px 12px;border-radius:10px;font-size:13.5px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px}
.cands{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cand .nm{font-size:14px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cand .sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px}
.cand .pc{font-size:clamp(34px,10vw,64px);font-weight:650;letter-spacing:-.035em;line-height:1.05;margin-top:4px;font-variant-numeric:tabular-nums}
.cand .vt{font-size:13px;color:var(--tx3);margin-top:2px;font-variant-numeric:tabular-nums}
.cand.r{text-align:right}.cand.lead .pc{color:var(--c)}
.badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:6px;color:#fff;background:var(--c);margin-left:6px;vertical-align:2px}
.h2h{position:relative;display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--sub);margin:14px 0 8px}
.h2h i{display:block;height:100%;transition:width .6s}.h2h .mid{position:absolute;left:50%;top:-2px;bottom:-2px;width:2px;margin-left:-1px;background:var(--card)}
.line{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--tx2);font-variant-numeric:tabular-nums}.line b{color:var(--tx);font-weight:600}
.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:12px;margin-top:12px}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
h2{font-size:14px;font-weight:650;margin:0 0 10px;color:var(--tx2);text-transform:uppercase;letter-spacing:.05em}
svg path{transition:fill .5s,fill-opacity .5s;cursor:pointer}
svg .mlab{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-weight:650;fill:var(--tx);stroke:var(--card);stroke-width:2.4px;paint-order:stroke fill;pointer-events:none}
svg .mlab .tp{font-weight:600}
.legend{display:flex;gap:14px;font-size:12px;color:var(--tx3);justify-content:center;margin-top:6px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.det{margin-top:10px;padding:12px;border-radius:12px;background:var(--sub);font-size:14px;min-height:74px}
.det .t{font-weight:650;margin-bottom:6px}.det .row{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.mini{height:6px;border-radius:3px;overflow:hidden;display:flex;background:var(--bd);margin:6px 0}
details summary{cursor:pointer;color:var(--tx2);font-size:14px;padding:4px 0;list-style:none}details summary::before{content:"▸ "}details[open] summary::before{content:"▾ "}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;margin-top:6px}th,td{padding:7px 4px;border-bottom:1px solid var(--bd);text-align:right}th:first-child,td:first-child{text-align:left}th{color:var(--tx3);font-weight:600;font-size:12px}tr.click{cursor:pointer}
.ext{font-size:13px;color:var(--tx2);margin-top:10px}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;align-items:center}.tabs button{border:1px solid var(--bd);background:var(--card);color:var(--tx2);padding:6px 12px;border-radius:999px;font:inherit;font-size:13px;cursor:pointer}.tabs button.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.tabs .upd{margin-left:auto;font-size:12px;color:var(--tx3)}
.feed{display:flex;flex-direction:column;gap:10px;max-height:1100px;overflow:auto;padding-right:2px}
.post{border:1px solid var(--bd);border-radius:12px;padding:11px 12px;background:var(--card)}
.post .a{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}.post .a b{font-size:14px}.post .a span{color:var(--tx3);font-size:12.5px}
.post .tag{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--tx3);border:1px solid var(--bd);border-radius:5px;padding:0 5px;margin-left:auto}
.post p{margin:6px 0 8px;white-space:pre-wrap;word-wrap:break-word;font-size:14px}
.post .m{display:flex;gap:14px;font-size:12.5px;color:var(--tx3)}.post .m a{margin-left:auto;color:var(--flavio);text-decoration:none;font-weight:600}
.post p a{color:var(--flavio);text-decoration:none}
footer{margin-top:18px;font-size:12px;color:var(--tx3);text-align:center}footer a{color:inherit}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Presidente 2026 · 2º turno</h1>
    <div class="meta"><span id="status"><span class="dot"></span>Carregando…</span><span id="apur"></span><span id="tse"></span><span id="ago"></span></div>
  </header>
  <div class="prog"><i id="progbar"></i></div>
  <div class="banner" id="banner"></div>

  <div class="card">
    <div class="cands" id="cands"></div>
    <div class="h2h"><i id="bA"></i><span style="flex:1"></span><i id="bB"></i><span class="mid"></span></div>
    <div class="line" id="line"></div>
  </div>

  <div class="grid">
    <div class="card">
      <h2>Mapa por estado</h2>
      <svg id="map" width="100%" style="display:block;max-width:520px;margin:0 auto" role="img" aria-label="Mapa do Brasil por estado"></svg>
      <div class="legend"><span><i style="background:var(--lula)"></i>Lula na frente</span><span><i style="background:var(--flavio)"></i>Flávio na frente</span><span><i style="background:var(--sub)"></i>sem votos</span></div>
      <div class="det" id="det">Toque em um estado para ver os detalhes.</div>
      <div class="ext" id="ext"></div>
      <details style="margin-top:10px"><summary>Todos os estados</summary><div id="tab"></div></details>
    </div>
    <div class="card">
      <h2>No X agora</h2>
      <div class="tabs" id="tabs"><button data-c="todos" class="on">Todos</button><button data-c="imprensa">Imprensa</button><button data-c="politicos">Políticos</button><span class="upd" id="pupd"></span></div>
      <div class="feed" id="feed"></div>
    </div>
  </div>
  <footer>Fonte: <a href="https://resultados.tse.jus.br/oficial/app/index.html" target="_blank" rel="noopener">TSE – resultados oficiais</a> (dados atualizados a cada 30 segundos). Posts: X. Página não oficial.</footer>
</div>
<script>
const MAPA=/*__MAPA__*/null;
const COR={"13":"var(--lula)","22":"var(--flavio)"};
const cor=n=>COR[n]||"var(--tx3)";
const N=v=>Number(v||0).toLocaleString("pt-BR");
const P=v=>Number(v||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})+"%";
const tit=s=>(s||"").toLowerCase().split(" ").map(w=>["da","de","do","dos","das","e"].includes(w)?w:w.charAt(0).toUpperCase()+w.slice(1)).join(" ");
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let D=null,P_=null,sel=null,cat="todos",lastOk=0,skew=0;

function ago(sec){sec=Math.max(0,Math.round(sec));if(sec<60)return sec+" s";const m=Math.floor(sec/60);if(m<60)return m+" min";return Math.floor(m/60)+" h "+(m%60)+" min"}

const BOX={};
function boxOf(d){
  const nums=d.match(/-?\d+(?:\.\d+)?/g)||[];
  let minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
  for(let i=0;i<nums.length;i+=2){const x=+nums[i],y=+nums[i+1];if(x<minx)minx=x;if(x>maxx)maxx=x;if(y<miny)miny=y;if(y>maxy)maxy=y}
  return {x:(minx+maxx)/2,y:(miny+maxy)/2,w:maxx-minx,h:maxy-miny};
}
function buildMap(){
  const s=$("map");s.setAttribute("viewBox",`0 0 ${MAPA.w} ${MAPA.h}`);
  const ufs=Object.keys(MAPA.p);
  const paths=ufs.map(uf=>{BOX[uf]=boxOf(MAPA.p[uf]);return `<path id="m-${uf}" d="${MAPA.p[uf]}" fill="var(--sub)" stroke="var(--card)" stroke-width=".8" stroke-linejoin="round"><title>${uf}</title></path>`}).join("");
  const labs=ufs.map(uf=>{const b=BOX[uf];return `<text class="mlab" id="t-${uf}" text-anchor="middle" font-size="7"><tspan class="tn" x="${b.x}" y="${b.y}">${uf}</tspan><tspan class="tp" x="${b.x}" dy="1.15em">—</tspan></text>`}).join("");
  s.innerHTML=paths+`<g id="labs">${labs}</g>`;
  s.querySelectorAll("path").forEach(p=>{const uf=p.id.slice(2);p.addEventListener("click",()=>pick(uf));p.addEventListener("mouseenter",()=>{if(matchMedia("(hover:hover)").matches)pick(uf)})});
}
function pick(uf){sel=uf;renderMap();renderDet()}

function render(){
  if(!D||!D.br)return;
  const b=D.br,c=b.candidatos,iniciou=b.secoes_tot>0;
  const A=c.find(x=>x.num==="13")||c[0],B=c.find(x=>x.num==="22")||c[1];
  const lead=iniciou?(A.votos>=B.votos?A:B):null;
  const eleito=c.find(x=>x.eleito);
  // status
  const now=Date.now()/1000+skew, stale=D.hora_changed_at?now-D.hora_changed_at:0;
  let st,dot,ban="";
  if(b.totalizacao_final||b.pct_apurado>=100){st="Apuração encerrada";dot=""}
  else if(stale>600&&iniciou){st="Sem novas parciais";dot="pause";ban=`O TSE não publica parciais novas há ${ago(stale)}. A apuração pode estar pausada; esta página continua consultando a cada 30 segundos.`}
  else if(!iniciou){st="Aguardando 1ª parcial";dot="pause"}
  else{st="Apuração em andamento";dot="live"}
  if(D.error&&D.ok_at&&now-D.ok_at>180){dot="err";ban=(ban?ban+" ":"")+`Não consegui falar com o TSE há ${ago(now-D.ok_at)} — mostrando os últimos dados válidos.`}
  $("status").innerHTML=`<span class="dot ${dot}"></span>${st}`;
  $("apur").innerHTML=`<b>${P(b.pct_apurado)}</b> das seções`;
  $("tse").textContent=`TSE ${b.hora} · ${b.data} (Brasília)`;
  $("progbar").style.width=Math.min(100,b.pct_apurado)+"%";
  $("banner").style.display=ban?"block":"none";$("banner").textContent=ban;
  const card=(x,r)=>{const isL=lead&&lead.num===x.num;const el=x.eleito?`<span class="badge" style="--c:${cor(x.num)}">Eleito</span>`:"";
    return `<div class="cand ${r?"r":""} ${isL?"lead":""}" style="--c:${cor(x.num)}"><div class="nm"><span class="sw" style="background:${cor(x.num)}"></span>${tit(x.nome)} · ${x.partido} ${x.num}${el}</div><div class="pc">${iniciou?P(x.pct):"—"}</div><div class="vt">${iniciou?N(x.votos)+" votos":"aguardando votos"}</div></div>`};
  $("cands").innerHTML=card(A,false)+card(B,true);
  $("bA").style.width=(iniciou?A.pct:0)+"%";$("bA").style.background=cor(A.num);
  $("bB").style.width=(iniciou?B.pct:0)+"%";$("bB").style.background=cor(B.num);
  const gap=Math.abs(A.votos-B.votos);
  $("line").innerHTML=(iniciou?`<span>Diferença <b>${N(gap)}</b> votos (${tit(lead.nome)})</span>`:"")+
   `<span>Seções <b>${N(b.secoes_tot)}</b> de ${N(b.secoes_total)}</span><span>Brancos <b>${P(b.pct_brancos)}</b></span><span>Nulos <b>${P(b.pct_nulos)}</b></span><span>Abstenção <b>${P(b.pct_abstencao)}</b></span>`;
  document.title=iniciou?`${tit(A.nome)} ${P(A.pct)} × ${P(B.pct)} ${tit(B.nome)} · ${P(b.pct_apurado)}`:"Apuração Presidente 2026";
  renderMap();renderDet();renderTab();
  const zz=D.ufs.find(u=>u.uf==="ZZ");
  $("ext").innerHTML=zz&&zz.secoes_tot>0?`Exterior: ${P(zz.pct_apurado)} apurado · ${zz.candidatos.map(x=>`${tit(x.nome)} <b>${P(x.pct)}</b>`).join(" · ")}`:"Exterior: votos já entram no total nacional; parcial separada ainda não publicada.";
}
function ufc(u){return u&&u.secoes_tot>0?u.candidatos:[]}
function Pp(v){return Number(v||0).toLocaleString("pt-BR",{minimumFractionDigits:0,maximumFractionDigits:1})+"%"}
function renderMap(){
  if(!D)return;const by={};D.ufs.forEach(u=>by[u.uf]=u);
  Object.keys(MAPA.p).forEach(uf=>{const p=$("m-"+uf);if(!p)return;const u=by[uf],c=ufc(u),b=BOX[uf];
    const m=c.length>1?c[0].pct-c[1].pct:c.length?100:0;
    p.setAttribute("fill",c.length?cor(c[0].num):"var(--sub)");p.setAttribute("fill-opacity",c.length?(0.35+0.65*Math.min(1,m/30)).toFixed(2):1);
    p.setAttribute("stroke",sel===uf?"var(--tx)":"var(--card)");p.setAttribute("stroke-width",sel===uf?2:.8);
    const nome=u?u.nome:uf, pct=u?Pp(u.pct_apurado):"—";
    p.querySelector("title").textContent=u?`${nome} · ${P(u.pct_apurado)} apurado`:uf;
    const lab=$("t-"+uf);
    if(lab&&b){
      let fs=Math.min(8,Math.max(5,Math.min(b.w,b.h)/6.4));
      const maxC=Math.max(2,Math.floor(b.w/(fs*0.56)));
      const show=nome.length<=maxC?nome:uf;
      if(show.length>maxC)fs=Math.max(4.5,b.w/2.6);
      lab.setAttribute("font-size",fs.toFixed(1));
      const tn=lab.querySelector(".tn"),tp=lab.querySelector(".tp");
      tn.textContent=show;tp.textContent=pct;
      tn.setAttribute("x",b.x);tn.setAttribute("y",b.y-fs*0.15);
      tp.setAttribute("x",b.x);
    }
    if(sel===uf)p.parentNode.appendChild(p);});
  const labs=$("labs");if(labs)labs.parentNode.appendChild(labs);
}
function renderDet(){
  if(!D||!sel)return;const u=D.ufs.find(x=>x.uf===sel);if(!u){$("det").textContent=sel+": sem dados";return}
  const c=ufc(u);
  if(!c.length){$("det").innerHTML=`<div class="t">${u.nome} (${u.uf})</div><div style="color:var(--tx3)">Nenhuma seção apurada ainda · ${N(u.eleitorado)} eleitores</div>`;return}
  $("det").innerHTML=`<div class="t">${u.nome} (${u.uf}) <span style="color:var(--tx3);font-weight:400">· ${P(u.pct_apurado)} apurado</span></div>`+
   `<div class="mini">${c.map(x=>`<i style="width:${x.pct}%;background:${cor(x.num)}"></i>`).join("")}</div>`+
   c.map(x=>`<div class="row"><span><span class="sw" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${cor(x.num)};margin-right:6px"></span>${tit(x.nome)}</span><span><b>${P(x.pct)}</b> · ${N(x.votos)}</span></div>`).join("");
}
function renderTab(){
  const rows=D.ufs.filter(u=>u.uf!=="ZZ").slice().sort((a,b)=>b.eleitorado-a.eleitorado).map(u=>{const c=ufc(u);const g=x=>{const y=c.find(z=>z.num===x);return y?P(y.pct):"—"};
    return `<tr class="click" data-uf="${u.uf}"><td><b>${esc(u.nome)}</b> <span style="color:var(--tx3)">${u.uf}</span></td><td>${P(u.pct_apurado)}</td><td style="color:var(--lula)">${g("13")}</td><td style="color:var(--flavio)">${g("22")}</td></tr>`}).join("");
  $("tab").innerHTML=`<table><tr><th>Estado</th><th>Apurado</th><th>Lula</th><th>Flávio</th></tr>${rows}</table>`;
  $("tab").querySelectorAll("tr.click").forEach(r=>r.addEventListener("click",()=>{pick(r.dataset.uf);$("map").scrollIntoView({behavior:"smooth",block:"center"})}));
}
function linkify(t){return esc(t).replace(/https?:\/\/\S+/g,u=>`<a href="${u}" target="_blank" rel="noopener">${u.replace(/^https?:\/\//,"")}</a>`)}
function hBR(iso){try{return new Date(iso).toLocaleTimeString("pt-BR",{timeZone:"America/Sao_Paulo",hour:"2-digit",minute:"2-digit"})+" (Brasília)"}catch(e){return iso}}
function renderPosts(){
  if(!P_)return;const list=(P_.posts||[]).filter(p=>cat==="todos"||p.category===cat).sort((a,b)=>(b.created_at||"").localeCompare(a.created_at||""));
  $("feed").innerHTML=list.length?list.map(p=>`<article class="post"><div class="a"><b>${esc(p.author_name)}</b><span>@${esc(p.username)} · ${hBR(p.created_at)}</span><span class="tag">${p.category==="politicos"?"Político":"Imprensa"}</span></div><p>${linkify(p.text)}</p><div class="m"><span>♥ ${N(p.likes)}</span><span>⟳ ${N(p.reposts)}</span>${p.views?`<span>👁 ${N(p.views)}</span>`:""}<a href="${esc(p.url)}" target="_blank" rel="noopener">Abrir no X ↗</a></div></article>`).join(""):`<div style="color:var(--tx3)">Nenhum post ainda.</div>`;
}
function tick(){
  if(D&&D.server_time){const now=Date.now()/1000+skew;const base=D.ok_at||D.fetched_at;$("ago").textContent=base?`atualizado há ${ago(now-base)}`:""}
  if(P_&&P_.note)$("pupd").textContent=P_.note;
  else if(P_&&P_.updated_at)$("pupd").textContent=`posts atualizados há ${ago((Date.now()-Date.parse(P_.updated_at))/1000)}`;
}
async function loadData(){try{const r=await fetch("/api/data?t="+Date.now(),{cache:"no-store"});const j=await r.json();skew=j.server_time-Date.now()/1000;D=j;render();tick()}catch(e){$("ago").textContent="sem conexão – tentando de novo"}}
async function loadPosts(){try{const r=await fetch("/api/posts?t="+Date.now(),{cache:"no-store"});P_=await r.json();renderPosts();tick()}catch(e){}}
$("tabs").querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{cat=b.dataset.c;$("tabs").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));renderPosts()}));
buildMap();loadData();loadPosts();
setInterval(loadData,30000);setInterval(loadPosts,60000);setInterval(tick,1000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden){loadData();loadPosts()}});
</script>
</body>
</html>
